<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12916A"/>
      <stop offset="1" stop-color="#0B6B4E"/>
    </linearGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0D1B16" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Fondo: capa de fondo (Android adaptive background) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Primer plano: capa foreground -->
  <g filter="url(#sombra)">
    <!-- Tarjeta trasera: las otras tarjetas del usuario -->
    <rect x="118" y="126" width="300" height="188" rx="26" fill="#FFFFFF" fill-opacity="0.28" transform="rotate(-9 268 220)"/>
    <!-- Tarjeta frontal: la elegida hoy -->
    <rect x="96" y="182" width="320" height="200" rx="28" fill="#F5F7F4"/>
    <!-- Chip -->
    <rect x="132" y="296" width="62" height="46" rx="11" fill="#F2B33D"/>
    <!-- Sello de acierto -->
    <circle cx="344" cy="248" r="46" fill="#0E7C5B"/>
    <path d="M322 249l15 15 30-31" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
